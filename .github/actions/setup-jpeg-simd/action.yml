name: Set up JPEG SIMD assembler
description: Make NASM available for the statically bundled x86 JPEG encoder
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v nasm >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
        fi
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v nasm >/dev/null; then
          brew install nasm
        fi
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        pwsh -File "${{ github.action_path }}/../../../scripts/setup_jpeg_simd.ps1"
        if ($LASTEXITCODE -ne 0) { throw 'JPEG SIMD setup failed' }
