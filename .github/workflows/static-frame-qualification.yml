name: Static preview frame qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'crates/opentake-render/**'
      - 'src-tauri/src/render.rs'
      - 'src-tauri/src/lut.rs'
      - 'src-tauri/src/export.rs'
      - 'src-tauri/src/mcp.rs'
      - 'src-tauri/src/playback/resolver.rs'
      - '.github/workflows/static-frame-qualification.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-preview:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      OPENTAKE_REQUIRE_GPU: '1'
      PR_BODY: ${{ github.event.pull_request.body }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: static-preview-windows-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: static-preview-windows-${{ runner.arch }}-
      - name: Verify issue link, compile native preview and run real GPU regressions
        run: |
          if ($env:PR_BODY -notmatch '(?im)^\s*(?:Refs|Closes|Fixes|Resolves)\s+#14\b') {
            throw 'Link issue #14 in the pull request description'
          }
          cargo clippy --locked -p opentake-tauri --lib -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native static preview lint failed' }
          function Assert-Case([string]$case) {
            $output = cargo test --locked -p opentake-tauri --lib $case -- --exact --nocapture --test-threads=1 2>&1
            $code = $LASTEXITCODE
            $lines = @($output | ForEach-Object { "$_" })
            $lines | ForEach-Object { Write-Output $_ }
            if ($code -ne 0) { throw "Static preview regression failed: $case" }
            $log = $lines -join "`n"
            if ($log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;' -or $log -match 'SKIP:') {
              throw "Static preview regression was skipped or did not run: $case"
            }
          }
          Assert-Case 'render::tests::preview_cancellation_returns_while_blocking_work_is_occupied'
          Assert-Case 'render::tests::preview_composite_rejects_missing_image_instead_of_returning_a_black_frame'
          Assert-Case 'render::tests::repeated_still_frames_reuse_managed_lut_without_rereading_it'
