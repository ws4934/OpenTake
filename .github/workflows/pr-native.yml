name: PR native checks

# The lightweight gate in pr.yml builds only the core crates on Linux. When a
# pull request changes Rust code, this workflow lints the whole workspace and
# tests every affected crate (see scripts/pr_native_scope.py) on Linux, Windows
# and macOS. Documentation- or web-only changes skip it. Tests that need a GPU
# or an audio device skip themselves on hosted runners; ci.yml keeps the
# release-time qualification.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Affected crates
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scope unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_pr_native_scope.py'

      - name: Select crates
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/pr_native_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  native:
    name: Native (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Free disk space
        if: runner.os == 'Linux'
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            patchelf \
            pkg-config \
            fonts-dejavu-core

      - name: Install Rust components
        run: rustup component add clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision pinned FFmpeg
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python scripts/provision_ffmpeg_sidecars.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg provisioning failed' }
          $triple = ((rustc -vV | Select-String '^host: ').ToString() -replace '^host: ', '').Trim()
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $tools = Join-Path $env:RUNNER_TEMP 'opentake-ffmpeg'
          New-Item -ItemType Directory -Force $tools | Out-Null
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $sidecar = Join-Path $env:GITHUB_WORKSPACE "src-tauri/binaries/$tool-$triple$suffix"
            if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) { throw "Missing $tool sidecar" }
            "OPENTAKE_$($tool.ToUpperInvariant())=$sidecar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Copy-Item -LiteralPath $sidecar -Destination (Join-Path $tools "$tool$suffix")
          }
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Clippy (whole workspace)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'clippy failed' }

      - name: Test affected crates
        env:
          PACKAGES: ${{ needs.scope.outputs.packages }}
        run: |
          # One cargo invocation per crate, exactly like a local `cargo test -p`.
          # Testing crates together would unify their features: opentake-tauri
          # enables opentake-motion's `chromium` feature, which turns on the
          # live browser tests that ci.yml runs on a qualified runner.
          $failed = @()
          foreach ($package in ($env:PACKAGES -split ' ' | Where-Object { $_ })) {
            Write-Output "::group::cargo test -p $package"
            cargo test --locked --no-fail-fast -p $package -- --test-threads=2
            $code = $LASTEXITCODE
            Write-Output '::endgroup::'
            if ($code -ne 0) {
              Write-Output "::error::cargo test -p $package failed"
              $failed += $package
            }
          }
          if ($failed) { throw "tests failed: $($failed -join ', ')" }
