name: Batch import regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core regressions and release benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Check the evidence validator
        run: python3 -B -m unittest discover -s scripts -p 'test_verify_batch_import.py' -v

      # Cargo/rustup use the repository's rust-toolchain.toml. The runner creates
      # a fresh target directory and never restores compiled workspace artifacts.
      - name: Named regressions and explicit release benchmark
        run: |
          python3 -B scripts/verify_batch_import.py \
            --expected-sha "$TARGET_SHA" \
            --output-dir "$RUNNER_TEMP/batch-import-evidence"

      - name: Retain candidate-bound evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-import-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-import-evidence
          if-no-files-found: error
          retention-days: 14

# This manual workflow compiles a release benchmark; PRs use pr.yml only.
# This is supplemental evidence only. Existing workspace/Tauri CI and native
# product gates still apply; catalog-size checks do not claim an RSS measurement.
