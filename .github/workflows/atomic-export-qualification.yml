name: Atomic export qualification

on:
  pull_request:
    paths:
      - 'src-tauri/src/export.rs'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/atomic-export-qualification.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  atomic-output:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libglib2.0-dev libsoup-3.0-dev patchelf pkg-config fonts-dejavu-core
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: atomic-export-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: atomic-export-${{ runner.os }}-${{ runner.arch }}-
      - name: Provision pinned FFmpeg resources
        shell: pwsh
        run: |
          $target = if ($env:RUNNER_OS -eq 'Windows') { 'x86_64-pc-windows-msvc' } else { 'x86_64-unknown-linux-gnu' }
          python scripts/provision_ffmpeg_sidecars.py --target $target
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg provisioning failed' }
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $extension = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
            $sidecar = Join-Path $env:GITHUB_WORKSPACE "src-tauri/binaries/$tool-$target$extension"
            if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) { throw "Missing $tool sidecar" }
            "OPENTAKE_$($tool.ToUpperInvariant())=$sidecar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Lint native export and run issue 28 regressions
        shell: pwsh
        run: |
          if ($env:PR_BODY -notmatch '(?im)^\s*(?:Refs|Closes|Fixes|Resolves)\s+#28\b') { throw 'Link issue #28 in the PR description' }
          cargo clippy --locked -p opentake-tauri --lib -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native export lint failed' }
          $cases = @(
            'export::tests::export_output_cleanup_removes_active_partial_output_on_drop',
            'export::tests::cancelled_native_encoder_preserves_the_previous_movie',
            'export::tests::completed_native_encoder_replaces_previous_movie',
            'export::tests::export_output_cleanup_keeps_successful_output_and_reserved_output',
            'export::tests::export_does_not_publish_over_a_target_replaced_during_encoding',
            'export::tests::publish_replaces_a_target_that_a_reader_still_holds_open',
            'export::tests::export_output_probe_reads_the_retained_file_before_cleanup'
          )
          if ($env:RUNNER_OS -eq 'Linux') {
            $cases += @(
              'export::tests::export_output_cleanup_does_not_remove_a_replaced_visible_path',
              'export::tests::export_output_identity_rejects_a_symlinked_visible_path',
              'export::tests::export_output_cleanup_uses_retained_parent_after_parent_swap',
              'export::tests::export_output_creation_stays_in_retained_parent_after_parent_swap',
              'export::tests::export_rejects_an_existing_symlink_without_touching_its_destination'
            )
          }
          foreach ($case in $cases) {
            $output = cargo test --locked -p opentake-tauri --lib $case -- --exact --nocapture --test-threads=1 2>&1
            $code = $LASTEXITCODE
            $text = (@($output | ForEach-Object { "$_" }) -join "`n")
            Write-Output $text
            if ($code -ne 0 -or $text -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') {
              throw "Issue 28 regression failed or was skipped: $case"
            }
          }
