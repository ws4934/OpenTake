name: Export video stream qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'src-tauri/src/export.rs'
      - '.github/workflows/export-stream-qualification.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-export-stream:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      PR_BODY: ${{ github.event.pull_request.body }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-export-stream-windows-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: native-export-stream-windows-${{ runner.arch }}-
      - name: Provision pinned FFmpeg for 300-frame source
        run: |
          python scripts/provision_ffmpeg_sidecars.py --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg provisioning failed' }
          $toolsDir = Join-Path $env:RUNNER_TEMP 'opentake-stream-ffmpeg'
          New-Item -ItemType Directory -Force $toolsDir | Out-Null
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $sidecar = Join-Path $env:GITHUB_WORKSPACE "src-tauri/binaries/$tool-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) { throw "Missing $tool sidecar" }
            "OPENTAKE_$($tool.ToUpperInvariant())=$sidecar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Copy-Item -LiteralPath $sidecar -Destination (Join-Path $toolsDir "$tool.exe")
          }
          $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check native export and run 300-frame stream and pixel regression
        run: |
          if ($env:PR_BODY -notmatch '(?im)^\s*(?:Refs|Closes|Fixes|Resolves)\s+#3\b') {
            throw 'Link issue #3 in the pull request description'
          }
          cargo clippy --locked -p opentake-tauri --lib -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native export lint failed' }
          $case = 'export::tests::sequential_export_decodes_300_frames_with_one_stream_per_clip'
          $output = cargo test --locked -p opentake-tauri --lib $case -- --exact --nocapture --test-threads=1 2>&1
          $code = $LASTEXITCODE
          $lines = @($output | ForEach-Object { "$_" })
          $lines | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) { throw "Export stream regression failed: $case" }
          $log = $lines -join "`n"
          if ($log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;' -or $log -match 'SKIP:') {
            throw 'Export stream regression did not execute'
          }
