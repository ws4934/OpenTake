name: Native media PR qualification

# The general PR gate checks lightweight crates. Use the issue references in the
# PR description to select the native acceptance cases for #8, #64, #97 and #99.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'src-tauri/src/export.rs'
      - 'src-tauri/src/media.rs'
      - 'src-tauri/src/playback/**'
      - '.github/workflows/native-media-qualification.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-media:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      PR_BODY: ${{ github.event.pull_request.body }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-media-windows-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: native-media-windows-${{ runner.arch }}-
      - name: Provision pinned Windows FFmpeg sidecars
        run: |
          python scripts/provision_ffmpeg_sidecars.py --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg provisioning failed' }
          $toolsDir = Join-Path $env:RUNNER_TEMP 'opentake-media-ffmpeg'
          New-Item -ItemType Directory -Force $toolsDir | Out-Null
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $sidecar = Join-Path $env:GITHUB_WORKSPACE "src-tauri/binaries/$tool-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) { throw "Missing $tool sidecar" }
            "OPENTAKE_$($tool.ToUpperInvariant())=$sidecar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Copy-Item -LiteralPath $sidecar -Destination (Join-Path $toolsDir "$tool.exe")
          }
          $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile native media commands and run linked-issue regressions
        run: |
          $linked = [System.Collections.Generic.HashSet[int]]::new()
          foreach ($line in [regex]::Matches($env:PR_BODY, '(?im)^\s*(?:closes|fixes|resolves)\s+[^\r\n]+')) {
            foreach ($match in [regex]::Matches($line.Value, '#(\d+)')) {
              [void]$linked.Add([int]$match.Groups[1].Value)
            }
          }
          if (-not ($linked.Contains(8) -or $linked.Contains(64) -or $linked.Contains(97) -or $linked.Contains(99))) {
            throw 'Link the relevant issue with Closes #8, #64, #97 or #99 and add its acceptance cases to this gate'
          }
          Write-Output "Qualifying linked issues: $($linked -join ', ')"

          cargo clippy --locked -p opentake-tauri --lib -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native Tauri media lint failed' }

          function Assert-CargoCase([string]$package, [string]$case) {
            $output = cargo test --locked -p $package --lib $case -- --exact --nocapture --test-threads=1 2>&1
            $code = $LASTEXITCODE
            $lines = @($output | ForEach-Object { "$_" })
            $lines | ForEach-Object { Write-Output $_ }
            if ($code -ne 0) { throw "Issue regression failed: $package $case" }
            $log = $lines -join "`n"
            if ($log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;' -or $log -match 'SKIP:') {
              throw "Issue regression was skipped or did not run: $package $case"
            }
          }

          $cases = @()
          if ($linked.Contains(8)) {
            $cases += @(
              'export::tests::owned_export_lease_preserves_cancellation_across_worker_handoff',
              'export::tests::cancel_export_command_returns_while_save_worker_owns_lease',
              'export::tests::pre_cancelled_export_leaves_existing_output_untouched',
              'export::tests::save_range_refuses_before_output_creation',
              'media::tests::save_clip_as_media_refuses_before_media_output_creation',
              'media::tests::project_switch_before_saved_media_transaction_leaves_replacement_unchanged',
              'media::tests::cancellation_inside_core_commit_rolls_back_without_terminal_progress'
            )
          }
          if ($linked.Contains(64)) {
            $cases += @(
              'media::tests::proxy_transcode_allows_save_and_readers_and_cleans_stale_stage',
              'media::tests::proxy_transcode_cancellation_cleans_private_stage'
            )
          }
          if ($linked.Contains(97)) {
            $cases += @(
              'playback::project::tests::proxy_projection_requires_enabled_present_and_matching_source_digest',
              'playback::project::tests::only_reachable_media_are_checked_and_old_proxies_fall_back'
            )
          }
          if ($linked.Contains(99)) {
            $cases += @(
              'playback::audio::tests::prefilled_audio_survives_start_and_resume_at_the_same_frame',
              'playback::audio::tests::audio_decode_stall_preserves_the_first_unplayed_sample',
              'playback::audio::tests::callback_crossing_a_window_boundary_waits_without_skipping_samples',
              'playback::engine::tests::resuming_paused_frame_preserves_decoders_but_moving_clears_them',
              'playback::audio::tests::streaming_consumer_discards_pre_seek_chunks_and_reports_underrun_as_silence'
            )
          }
          if ($linked.Contains(64) -or $linked.Contains(97)) {
            Assert-CargoCase opentake-core 'core::tests::proxy_job_commit_allows_save_but_rejects_newer_proxy_and_project'
          }
          if ($linked.Contains(97)) {
            Assert-CargoCase opentake-domain 'media::tests::legacy_proxy_without_source_stamp_still_decodes'
            Assert-CargoCase opentake-media 'proxy::tests::background_proxy_source_check_is_cancellable_and_detects_changes'
          }
          foreach ($case in $cases) {
            Assert-CargoCase opentake-tauri $case
          }
