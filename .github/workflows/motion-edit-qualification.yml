name: Motion edit qualification

on:
  pull_request:
    paths:
      - 'src-tauri/src/motion.rs'
      - 'src-tauri/tests/motion_command.rs'
      - '.github/workflows/motion-edit-qualification.yml'

permissions:
  contents: read

jobs:
  native-motion:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      OPENTAKE_MOTION_TRACE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-jpeg-simd

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: motion-edit-windows-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
      - name: Provision pinned FFmpeg
        run: |
          python scripts/provision_ffmpeg_sidecars.py --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg provisioning failed' }
          $toolsDir = Join-Path $env:RUNNER_TEMP 'opentake-motion-ffmpeg'
          New-Item -ItemType Directory -Force $toolsDir | Out-Null
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $sidecar = Join-Path $env:GITHUB_WORKSPACE "src-tauri/binaries/$tool-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) { throw "Missing $tool sidecar" }
            "OPENTAKE_$($tool.ToUpperInvariant())=$sidecar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Copy-Item -LiteralPath $sidecar -Destination (Join-Path $toolsDir "$tool.exe")
          }
          $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify hidden Windows console helpers
        run: |
          cargo test --locked -p opentake-process-tree --lib tests::windows_console_commands_have_no_visible_window -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows console helper test failed' }
      - name: Exercise opaque and transparent edits
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo clippy --locked -p opentake-tauri --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native lint failed' }
          $cases = @(
            @('--lib', 'motion::tests::motion_edit_preserves_recorded_transparency'),
            @('--test', 'motion_command', 'sandbox_progress_cancel_validated_mp4_result'),
            @('--test', 'motion_command', 'transparent_motion_publishes_prores_alpha_and_marks_manifest')
          )
          foreach ($case in $cases) {
            $output = cargo test --locked -p opentake-tauri @case -- --exact --nocapture --test-threads=1 2>&1
            $code = $LASTEXITCODE
            $lines = @($output | ForEach-Object { "$_" })
            $lines | ForEach-Object { Write-Output $_ }
            if ($code -ne 0) { throw "Native motion test failed: $($case[-1])" }
            $log = $lines -join "`n"
            if ($log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;' -or $log -match 'SKIP:') {
              throw "Native motion test was skipped or did not run: $($case[-1])"
            }
          }
