name: PR checks

# Pull requests check the lightweight Rust crates, workflow/provisioning scripts,
# and web build/tests. Full workspace and desktop integration checks live in
# ci.yml and release.yml for release tags or manual dispatch.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (lightweight crates / scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-light-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-light-

      - name: Validate Windows product gate contract
        run: |
          python3 -B scripts/check_windows_product_ci.py
          python3 -B -m unittest discover -s scripts -p 'test_check_windows_product_ci.py'

      - name: Validate release workflow contract
        run: |
          python3 -B scripts/check_release_workflow.py --workflow-only
          python3 -B -m unittest discover -s scripts -p 'test_check_release_workflow.py'

      - name: Validate C1B CI and evidence contracts
        run: |
          ruby scripts/tests/validate-c1b-ci-test.rb
          ruby scripts/tests/validate-c1b-evidence-test.rb

      - name: Provisioner unit tests (scripts/tests)
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Bundled FFmpeg smoke (no system FFmpeg)
        run: |
          python3 scripts/provision_ffmpeg_sidecars.py --target x86_64-unknown-linux-gnu
          ruby scripts/tests/packaged-sidecars-test.rb

      - name: cargo fmt
        run: cargo fmt --all --check

      # Explicit packages keep Tauri, GPU, audio and ML backends out of the PR gate.
      - name: cargo clippy
        run: >-
          cargo clippy --locked
          -p opentake-domain -p opentake-ops -p opentake-project -p opentake-process-tree -p opentake-core
          --all-targets -- -D warnings

      - name: cargo test
        run: >-
          cargo test --locked
          -p opentake-domain -p opentake-ops -p opentake-project -p opentake-process-tree -p opentake-core
          -- --test-threads=1

  web:
    name: Web (install / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm -C web install --frozen-lockfile

      - name: Validate Web dependency licenses
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_check_license_inventory.py'
          python3 -B scripts/check_license_inventory.py

      - name: pnpm build
        run: pnpm -C web build

      - name: pnpm test
        run: pnpm -C web test
