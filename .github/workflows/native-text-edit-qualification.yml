name: Windows native FFmpeg filename qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-filenames:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up JPEG SIMD assembler
        run: |
          pwsh -File scripts/setup_jpeg_simd.ps1
          if ($LASTEXITCODE -ne 0) { throw 'JPEG SIMD setup failed' }
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Provision pinned FFmpeg
        run: |
          python scripts/provision_ffmpeg_sidecars.py --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg provisioning failed' }
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $sidecar = Join-Path $env:GITHUB_WORKSPACE "src-tauri/binaries/$tool-x86_64-pc-windows-msvc.exe"
            "OPENTAKE_$($tool.ToUpperInvariant())=$sidecar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Qualify native path arguments against retained files
        run: |
          cargo test --locked -p opentake-media --test ffmpeg_integration native_windows_ -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native filename qualification failed' }
