name: Native text edit qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/src/components/shell/ViewMenu.tsx'
      - 'web/src/lib/textEntry.ts'
      - 'web/src/hooks/useKeyboardShortcuts.ts'
      - 'scripts/qualify_native_text_edit.ps1'
      - '.github/workflows/native-text-edit-qualification.yml'

permissions:
  contents: read

jobs:
  windows-text-edit:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-text-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Provision pinned FFmpeg
        run: |
          python scripts/provision_ffmpeg_sidecars.py --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg provisioning failed' }
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $sidecar = Join-Path $env:GITHUB_WORKSPACE "src-tauri/binaries/$tool-x86_64-pc-windows-msvc.exe"
            "OPENTAKE_$($tool.ToUpperInvariant())=$sidecar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build the packaged frontend and native shell
        run: |
          pnpm -C web install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend installation failed' }
          ./web/node_modules/.bin/tauri.cmd build --debug --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Native package build failed' }
      - name: Qualify native text and document shortcuts
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target/debug/opentake.exe'
          $fixtures = Join-Path $env:RUNNER_TEMP 'native-edit-qualification'
          pwsh -STA -File scripts/qualify_native_text_edit.ps1 -Executable $exe -TestRoot $fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Native text editing qualification failed' }
