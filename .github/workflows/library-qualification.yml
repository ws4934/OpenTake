name: Library issue 50 qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'crates/opentake-media/src/library.rs'
      - 'src-tauri/src/library.rs'
      - 'src-tauri/src/media.rs'
      - '.github/workflows/library-qualification.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-library:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      PR_BODY: ${{ github.event.pull_request.body }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-media-windows-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: native-media-windows-${{ runner.arch }}-
      - name: Compile library commands and run issue 50 acceptance cases
        run: |
          if ($env:PR_BODY -cnotmatch '(?im)^\s*(?:closes|fixes|resolves|refs)\s+#50\b') {
            throw 'Link issue #50 in the pull request description'
          }
          cargo clippy --locked -p opentake-tauri --lib -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native library lint failed' }

          function Assert-CargoCase([string]$package, [string]$case) {
            $output = cargo test --locked -p $package --lib $case -- --exact --nocapture --test-threads=1 2>&1
            $code = $LASTEXITCODE
            $lines = @($output | ForEach-Object { "$_" })
            $lines | ForEach-Object { Write-Output $_ }
            if ($code -ne 0) { throw "Issue regression failed: $package $case" }
            $log = $lines -join "`n"
            if ($log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;' -or $log -match 'SKIP:') {
              throw "Issue regression was skipped or did not run: $package $case"
            }
          }

          Assert-CargoCase opentake-media 'library::tests::project_scoped_verification_does_not_hash_unreferenced_library_content'
          foreach ($case in @(
            'media::tests::slow_favorite_copy_allows_save_as_and_rejects_stale_commit',
            'media::tests::sync_ignores_corrupted_content_unreferenced_by_this_project',
            'media::tests::sync_commits_stale_cleanup_when_another_copy_lookup_fails',
            'media::tests::stale_project_identity_cannot_mutate_replacement_project_or_global_library',
            'library::tests::library_import_probe_allows_save_as_without_copying_an_uncommitted_leaf',
            'library::tests::failed_library_import_restores_manifest_and_retry_does_not_duplicate'
          )) {
            Assert-CargoCase opentake-tauri $case
          }
