[package]
name = "opentake-project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = ".opentake project bundle read/write (serde) + media manifest/archive."

[features]
test-hooks = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_ignored = { workspace = true }
opentake-domain = { workspace = true }
thiserror = "2"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
same-file = "1.0.6"
uuid = { workspace = true }
sha2 = "0.10"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Exercise the desktop sample service without building Tauri, media or GPU crates.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
serde_json = { workspace = true }
# Independent reader for the exporters' `file:` URLs (round-trip tests).
url = "2"
